<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaceLobby — Verify</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    window.onTurnstileLoad = function () { window.__turnstileReady = true; };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" async defer></script>
</head>
<body>
  <main class="card" id="card">
    <header class="brand">
      <h1>MaceLobby</h1>
      <p class="brand-id">ID=1038</p>
      <p class="brand-sub" id="subtitle">Loading…</p>
    </header>

    <p class="instructions" id="instructions" hidden>
      Verify you're human to enter the server.
    </p>

    <form id="verify-form" hidden novalidate>
      <input id="code" name="code" type="hidden" />
      <div class="captcha" id="turnstile-container"></div>
      <button type="submit" class="submit" id="submit-btn" disabled>Continue</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="success" class="success" hidden>
      <p class="success-line">Verified, <span id="success-name"></span>.</p>
      <p class="success-hint">Return to your Minecraft client — you've been teleported in.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
